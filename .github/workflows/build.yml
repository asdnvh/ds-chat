name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: bash .github/scripts/install-android-sdk.sh

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (debug-signed if no secrets)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Static verification (best effort)
        shell: pwsh
        run: |
          ./tools/static-verify-apk.ps1 `
            -DebugApk android/app/build/outputs/apk/debug/app-debug.apk `
            -ReleaseApk android/app/build/outputs/apk/release/app-release.apk
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DSChat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DSChat-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 失败时把 SDK 安装日志写进 commit 评论，便于公开排查（无需登录 API）
      - name: Publish SDK install log for debugging
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s sdk-install.log ]; then
            echo "没有 sdk-install.log，跳过"
            exit 0
          fi
          tail -c 60000 sdk-install.log > sdk-install.tail.log
          jq -Rs '{body: ("CI failure: install-android-sdk log\n```\n" + . + "\n```")}' sdk-install.tail.log > payload.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input payload.json > /dev/null || true
